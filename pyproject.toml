[project]
name = "mdstats"
version = "0.1.0"
description = "Markdown repository statistics and link auditor CLI"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Hermes Agent", email = "agent@nousresearch.com"}]
keywords = ["markdown", "statistics", "link-auditor", "cli", "docs"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
mdstats = "mdstats:main"

[project.optional-dependencies]
dev = ["ruff", "pytest"]

[tool.setuptools]
py-modules = ["mdstats"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
